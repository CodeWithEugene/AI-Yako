<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Yako</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%234f46e5'/><text x='50' y='66' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif'>Y</text></svg>"
    />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <h1 class="brand" id="brand">Yako</h1>
        <span class="badge" id="offlineBadge">
          <svg class="badge-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 3a9 9 0 1 0 9 9"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
            />
            <path d="M3 3l18 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
          </svg>
          <span id="offlineText">Offline</span>
        </span>
        <button class="icon-button" id="aboutButton" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2" />
            <path d="M12 10v6" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            <circle cx="12" cy="7.4" r="1.3" fill="currentColor" />
          </svg>
          <span class="sr-only" id="aboutLabel">About</span>
        </button>
      </header>

      <main class="panels" id="panels">
        <section class="panel panel-source" aria-labelledby="sourceLangName">
          <div class="panel-head">
            <span class="panel-eyebrow" id="sourceLabel">From</span>
            <h2 class="panel-lang" id="sourceLangName">English</h2>
          </div>
          <p class="heard" id="heardText" aria-live="polite"></p>
          <textarea
            class="type-input"
            id="typeInput"
            rows="3"
            aria-label="Type text to translate"
          ></textarea>
        </section>

        <button class="swap" id="swapButton" aria-label="Swap languages">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M7 4 3 8l4 4"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path d="M3 8h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            <path
              d="m17 20 4-4-4-4"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path d="M21 16H7" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>

        <section class="panel panel-target" aria-labelledby="targetLangName">
          <div class="panel-head">
            <span class="panel-eyebrow" id="targetLabel">To</span>
            <h2 class="panel-lang" id="targetLangName">Swahili</h2>
          </div>
          <p class="translation" id="translationText" aria-live="polite"></p>
          <button class="speak-button" id="speakButton" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 9v6h4l6 5V4L8 9H4z" fill="currentColor" />
              <path
                d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
            <span id="speakLabel">Play translation</span>
          </button>
        </section>
      </main>

      <div class="empty-state" id="emptyState">
        <div class="empty-ring" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <rect
              x="9"
              y="3"
              width="6"
              height="11"
              rx="3"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            />
            <path
              d="M5 11a7 7 0 0 0 14 0M12 18v3"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        </div>
        <h2 id="emptyTitle">Say something</h2>
        <p id="emptyHint">Press the mic and speak, or type below.</p>
      </div>

      <div class="error-state" id="errorState" role="alert" hidden>
        <h2 id="errorTitle">Something went wrong</h2>
        <p id="errorMessage"></p>
        <p class="error-hint" id="errorHint"></p>
        <button class="ghost-button" id="errorDismiss">Dismiss</button>
      </div>

      <footer class="controls">
        <p class="status-line" id="statusLine" role="status">Ready.</p>
        <div class="mic-row">
          <button class="mic-button" id="micButton" aria-pressed="false">
            <span class="mic-ring" aria-hidden="true"></span>
            <svg class="mic-icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor" />
              <path
                d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
            <span class="sr-only" id="micAriaLabel">Press and hold to speak</span>
          </button>
          <button class="primary-button" id="translateButton">Translate</button>
        </div>
      </footer>
    </div>

    <dialog class="about-dialog" id="aboutDialog" aria-labelledby="aboutTitle">
      <div class="dialog-head">
        <h2 id="aboutTitle">About</h2>
        <button class="icon-button" id="aboutClose" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M6 6l12 12M18 6 6 18"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        </button>
      </div>
      <p class="offline-note" id="offlineNote"></p>
      <h3 id="metricsTitle">Performance on this device</h3>
      <dl class="metrics" id="metricsList"></dl>
      <h3 id="modelsTitle">On-device models</h3>
      <ul class="models" id="modelsList"></ul>
    </dialog>

    <script src="strings.js"></script>
    <script src="app.js"></script>
  </body>
</html>
